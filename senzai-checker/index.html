  function ask(i) {
    state.step = i;
    progress();
    const q = Q[i];

    let blockWhy = "";
    if (q.id === "how") {
      if (state.a.type === "color") blockWhy = "色柄ものは、ほかの服に色が移ったり、移されたりするおそれがあるため、ほかの服とまとめて洗うのはおすすめしません。分けて洗うか、手洗い・つけ置きにしましょう。";

      if (blockWhy && state.a.how === "together") state.a.how = null;

    app.innerHTML = `

      <div class="opts">${q.opts.map(o => {
        const on = q.multi ? cur.includes(o.v) : cur === o.v;
        if (blockWhy && o.v === "together") {
          return `<button class="opt off" data-v="${o.v}" disabled aria-disabled="true"><span class="ico">${icon(o.ico)}</span><span class="t">${esc(o.t)}</span><span class="s">おすすめしません</span></button>`;

    app.querySelectorAll(".opt:not(.off)").forEach(b => b.onclick = () => pick(q, b.dataset.v));
    document.getElementById("back").onclick = () => { play("back"); i === 0 ? start() : ask(i - 1); };
    if (q.multi) document.getElementById("next").onclick = () => { if (i + 1 < Q.length) play("next"); next(i); };
    window.scrollTo(0, 0);

  function pick(q, v) {
    if (q.multi) {
      let cur = state.a[q.id] || [];
      if (v === "none") cur = cur.includes("none") ? [] : ["none"];
      else { cur = cur.filter(x => x !== "none"); cur = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]; }
      play(cur.includes(v) ? "tap" : "untap");
      state.a[q.id] = cur;
      ask(state.step);
      return;
    }
    state.a[q.id] = v;
    if (q.id === "wash" && v === "unknown") { window.open("https://familycleaning.jp/sentaku-checker/", "_blank", "noopener"); state.a.wash = null; ask(0); return; }
    // 選んだカードが光って音が鳴るのを少し見せてから、次へ進む
    play("select");
    app.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
    const step = state.step;
    setTimeout(() => {
      if (state.step !== step) return;
      if (q.id === "wash" && v === "no") { result(); return; }
      next(step);
    }, 260);
  }

  function next(i) { i + 1 < Q.length ? ask(i + 1) : result(); }

  // ===== 結果を組み立てる =====
  function card(key, forWhat) {
    const p = P[key];
    const links = p.own
      ? `<a class="main" href="${p.url}" target="_blank" rel="noopener">くわしく見る・買う</a>`
      : `<a class="main" href="${amz(p.amz || p.q)}" target="_blank" rel="sponsored nofollow noopener">Amazon</a><a href="${rak(p.q)}" target="_blank" rel="sponsored nofollow noopener">楽天</a>`;
    return `<div class="item${p.own ? " own" : ""}">
      <div class="tags">${p.own ? '<span class="tag own">当店オリジナル</span>' : ""}${forWhat ? `<span class="tag for">${esc(forWhat)}</span>` : ""}</div>
      <div class="nm">${esc(p.nm)}</div>
      <p class="ds">${esc(p.ds)}</p><div class="buy">${links}</div></div>`;
  }

  function result() {
    state.step = Q.length;
    progress();
    const a = state.a;
    play(a.wash === "no" ? "notice" : "result");

    } else {
      if (a.pref === "plain" || a.pref === "any") det.push(["koredake", a.how === "together" ? "まとめ洗い・色移り防止" : "無香料・柔軟剤いらず"]);
      if (a.type === "white") { detWhy = "白物や汚れの多い普段着は、弱アルカリ性の洗剤が向く処方が多いです。"; det.push(["reset", "白物・皮脂"]); }
      if (a.type === "color") { detWhy = "色柄ものは、色への負担に配慮した中性の洗剤が選びやすいです。まとめて洗うなら色移りにも注意。"; det.push(["attackzero", "色柄もの"]); }
      if (a.type === "daily") { detWhy = "普段着は、水量と洗濯物の量に合う「適量」が基本です。"; det.push(["attackzero", "普段着"], ["gelball", "手軽に"]); }
      if (a.pref === "softlight" || a.pref === "softscent") det.unshift(["koredake", "柔軟剤を足さない選択肢も"]);
      det.push(["snowl", "せっけん派の方に"]);
    }
    const seen = new Set();
    const detU = det.filter(([k]) => (seen.has(k) ? false : seen.add(k)));
    no++;
    html.push(`<div class="sec"><h2><span class="no">${String(no).padStart(2, "0")}</span>洗剤</h2><p class="why">${esc(detWhy || "服に合う洗剤を選びましょう。")}</p>
      ${detU.map(([k, w]) => card(k, w)).join("")}
      ${delicate ? `<p class="note warn">ウール・シルクなどは、洗濯表示で家庭洗濯（手洗い）ができるものを、手洗いでやさしく洗ってください。素材の性質や編み方・仕立てによっては、わずかに縮むものもあります。これは洗剤ではなく、衣類そのものの性質によるものです。</p>` : ""}
      ${a.how === "together" && a.type === "color" ? `<p class="note warn">色の濃い新しい服は、色落ちすることがあります。最初の数回は分けて洗うと安心です。</p>` : ""}
      <p class="note ok">洗剤は多く入れても、よく落ちるとは限りません。表示の量を守りましょう。</p></div>`);

    // ③ 漂白剤（必要なときだけ）
    const needBleach = !delicate && (stains.includes("yellow") || (stains.includes("color") && a.type !== "delicate"));
    if (needBleach) {
      no++;
      const bl = [];
      if (stains.includes("yellow")) bl.push(["oxi", "黄ばみのつけ置き"], ["shabonox", "黄ばみのつけ置き"]);
      if (stains.includes("color")) bl.push(["widehaiter", "色柄にも"]);
      html.push(`<div class="sec"><h2><span class="no">${String(no).padStart(2, "0")}</span>漂白剤（必要なときだけ）</h2>
        <p class="why">洗剤を助ける役です。使う前に、服の洗濯表示の三角マークを確認してください（△＝塩素系・酸素系どちらも可／斜線入りの△＝酸素系のみ／×付きの△＝漂白不可）。</p>
        ${bl.map(([k, w]) => card(k, w)).join("")}
        <p class="note warn">酸素系の粉末は、毛・絹や金属のボタン・ファスナーが付いた服に使えないことがあります。表示を確認してください。</p>
        <p class="note danger">混ぜるな危険：塩素系漂白剤と、酸性タイプの製品・酢・クエン酸は絶対に混ぜない。漂白剤どうしも混ぜない。</p></div>`);
    } else if (delicate && stains.includes("yellow")) {
      no++;
      html.push(`<div class="sec"><h2><span class="no">${String(no).padStart(2, "0")}</span>黄ばみについて</h2><p>デリケートな服の黄ばみは、家庭の漂白剤では素材を傷めることがあります。クリーニング店の染み抜き・黄ばみ取りをご相談ください。</p></div>`);
    }

    // ④ 柔軟仕上げ剤
    no++;
    if (a.pref === "softlight" || a.pref === "softscent") {
      const sf = a.pref === "softlight" ? [["humming", "香り控えめ"], ["sarasa", "着色料無添加"]] : [["lenor", "香り・消臭"], ["soflan", "消臭"], ["humming", "香り控えめ"]];
      html.push(`<div class="sec"><h2><span class="no">${String(no).padStart(2, "0")}</span>柔軟仕上げ剤（お好みで）</h2>
        <p class="why">手ざわり・静電気・香りを整える仕上げ役です。洗う力はありません。専用の投入口に、表示の量を。</p>
        ${sf.map(([k, w]) => card(k, w)).join("")}
        <p class="note warn">多いほどふんわり、ではありません。タオルの吸水が落ちることもあります。</p></div>`);
    } else {
      html.push(`<div class="sec"><h2><span class="no">${String(no).padStart(2, "0")}</span>柔軟仕上げ剤</h2>
        <p>今回は「足さない」でOK。柔軟仕上げ剤は好みで使う仕上げ役で、毎回必要なものではありません。${delicate ? "" : "ふんわり感がほしいときは、柔軟剤を足さずに仕上げる設計の「これだけ洗剤」という選び方もあります。"}</p></div>`);
    }

    const sum = [
      Q[0].opts.find(o => o.v === a.wash)?.t, Q[1].opts.find(o => o.v === a.type)?.t,
      stains.length ? stains.map(s => STAIN_LABEL[s]).join("・") : "汚れなし",
      Q[3].opts.find(o => o.v === a.how)?.t, Q[4].opts.find(o => o.v === a.pref)?.t,
    ].filter(Boolean).join("／");

    app.innerHTML = `
      <p class="eyebrow">Your Laundry Routine</p>
      <p class="q">あなたの服に合う、洗い方の流れ</p>
      <p class="summary">選んだこと：${esc(sum)}</p>
      <p class="pr">【PR】Amazon・楽天のリンクはアフィリエイト広告です。商品は代表例で、順位ではありません。</p>
      ${html.join("")}
      <p class="small">仕上がりは、素材・汚れの状態・水温・洗濯機・使う量で変わります。服の洗濯表示と、商品の表示を優先してください。</p>
      <a class="cta" href="${LINE}" target="_blank" rel="noopener">大切な服は、LINEで写真相談（無料）</a>
      <a class="link-card" href="https://familycleaning.jp/laundry-detergent-map/">洗剤の種類と違いをくわしく → 洗濯洗剤マップ</a>
      <div class="nav"><button class="btn ghost" id="back">もどる</button><button class="btn primary" id="again">別の服で試す</button></div>`;
    document.getElementById("again").onclick = start;
    document.getElementById("back").onclick = () => ask(Q.length - 1);
    window.scrollTo(0, 0);
  }

  start();
})();
</script>
</body>
</html>
