<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>臨時休業のお知らせ（SNS・LINE 1080×1080）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>
  :root {
    --blue: #1f5fa8;
    --blue-deep: #17487f;
    --blue-pale: #eaf2fb;
    --ink: #1d2b3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: #fff; }
  body { font-family: "Noto Sans JP", sans-serif; color: var(--ink); }
  .page {
    width: 1080px;
    height: 1080px;
    padding: 40px 56px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }
  .head {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border-radius: 28px;
    padding: 12px 0 16px;
    white-space: nowrap;
  }
  .head .big { font-size: 140px; font-weight: 900; line-height: 1.1; letter-spacing: 0.03em; }
  .head .sub { font-size: 64px; font-weight: 700; letter-spacing: 0.06em; }
  .lead { font-size: 36px; font-weight: 700; line-height: 1.5; }
  .dates {
    width: 100%;
    border: 10px solid var(--blue);
    border-radius: 28px;
    padding: 10px 0 14px;
    background: var(--blue-pale);
  }
  .dates .d {
    display: block;
    font-size: 98px;
    font-weight: 900;
    line-height: 1.2;
    color: var(--blue-deep);
    font-feature-settings: "palt";
    white-space: nowrap;
  }
  .reopen { font-size: 52px; font-weight: 900; line-height: 1.3; color: var(--blue-deep); white-space: nowrap; font-feature-settings: "palt"; }
  .msg { font-size: 33px; font-weight: 500; line-height: 1.55; }
  .shop {
    width: 100%;
    border-top: 3px solid var(--blue);
    padding-top: 10px;
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--blue);
  }
</style>
</head>
<body>
<main class="page">
  <h1 class="head"><span class="big">臨時休業</span><span class="sub">のお知らせ</span></h1>
  <p class="lead">台風接近のため、<br>下記の日程を臨時休業とさせていただきます。</p>
  <p class="dates"><span class="d">10月25日（日）・</span><span class="d">10月26日（月）</span></p>
  <p class="reopen">10月27日（火）より通常営業いたします。</p>
  <p class="msg">お客様とスタッフの安全を考えての判断です。<br>ご迷惑をおかけいたしますが、よろしくお願い申し上げます。</p>
  <p class="shop">ファミリークリーニング</p>
</main>
</body>
</html>
