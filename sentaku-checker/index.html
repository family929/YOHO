/* ==========================================================
   色の設定（ライト／ダーク）
   ========================================================== */
:root {
  --bg: #fdf8f5;
  --card: #ffffff;
  --ink: #4a3d38;
  --ink-sub: #8b7d76;
  --line: #efe1db;
  --accent: #c88581;
  --accent-fg: #a8625f;
  --accent-ink: #ffffff;
  --accent2: #a39a6e;
  --accent2-ink: #ffffff;
  --accent3: #6f9a84;
  --accent3-ink: #ffffff;
  --sel-bg: #fbf1ee;
  --sel-line: #d39794;
  --ok: #4f7462;
  --ok-bg: #e3ede6;
  --warn: #8a6a2e;
  --warn-bg: #fbf3e4;
  --pro: #a8625f;
  --pro-bg: #f8e9e6;
  --sym-bg: #ffffff;
  --shadow: 0 8px 26px rgba(168,98,95,.08);
  --gold: #a39a6e;
  --rose: #d39794;
  --font-serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --serif-en: "Cormorant Garamond", "Times New Roman", serif;
  color-scheme: light;
}

/* ==========================================================
   基本
   ========================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.7;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent-fg); }
button { font: inherit; color: inherit; }

/* 1画面1問の骨組み。min-height（heightではない）なので、通常はスクロールなしで収まり、
   文字拡大などで内容が増えたときは枠を広げて縦スクロールできる（overflowは切らない） */
.step-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.step-shell > header.top { flex: 0 0 auto; }
.step-main {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 10px;
  padding: 4px 16px;
}
.step-footer { flex: 0 0 auto; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); }
.step-q { font-family: var(--font-serif); font-size: 17px; margin: 0; text-align: center; }

.result-main { padding-bottom: 8px; }

/* 最初のタイトル画面（どーんと出して、すぐ1問目へ） */
.splash {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink); text-align: center; padding: 16px;
  animation: splash-out .35s ease 1.45s forwards;
}
.splash-band { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: var(--accent); }
.splash-in { animation: splash-pop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
.splash-lead { font-family: var(--font-serif); font-size: 22px; margin: 0; letter-spacing: .08em; }
.splash-big { font-family: var(--font-serif); font-size: 64px; font-weight: 800; line-height: 1.15; margin: 2px 0 14px; color: var(--splash-big, var(--accent)); }
.splash-sub { display: inline-block; font-size: 17px; font-weight: 700; letter-spacing: .12em; margin: 0; padding: 4px 14px; border-top: 2px solid var(--accent2); border-bottom: 2px solid var(--accent2); }
.splash-brand { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 13px; color: var(--ink-sub); margin: 0; letter-spacing: .05em; }
@keyframes splash-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes splash-out { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  .splash-in { animation: none; }
  .splash { animation: splash-out .01s linear 1s forwards; }
}

@keyframes noren-fade { from { opacity: 0; } to { opacity: 1; } }
.step-main, .result-main { animation: noren-fade .2s ease; }

header.top { padding: 14px 0 8px; }
.brand { font-size: 13px; color: var(--ink-sub); margin: 0; letter-spacing: .05em; }
.noren-line { height: 2px; background: var(--accent); margin: 6px 0 10px; }

/* 進み具合 */
.progress-label { font-size: 13px; color: var(--ink-sub); margin: 0 0 6px; }
.progress-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); }

.grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
}
@media (min-width: 520px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.sym {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 92px; padding: 8px 4px 6px;
  background: var(--sym-bg); border: 2px solid var(--line); border-radius: 6px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.sym svg { width: 44px; height: 44px; color: var(--ink); flex: 0 0 auto; }
.sym .lbl { font-size: 13px; line-height: 1.25; margin-top: 4px; text-align: center; word-break: keep-all; overflow-wrap: anywhere; }
.sym[aria-pressed="true"] { border-color: var(--sel-line); background: var(--sel-bg); }
.sym[aria-pressed="true"] .lbl { font-weight: 700; }
.sym:focus-visible { outline: 3px solid var(--accent-fg); outline-offset: 2px; }
.sym.new .lbl::after { content: "2024新"; display: block; font-size: 10px; color: var(--accent-fg); font-weight: 700; }

.none-btn {
  margin-top: 2px; width: 100%;
  background: transparent; border: 1px dashed var(--line); border-radius: 4px;
  padding: 8px; font-size: 13px; color: var(--ink-sub); cursor: pointer;
  touch-action: manipulation;
}
.none-btn[aria-pressed="true"] { border-style: solid; border-color: var(--sel-line); background: var(--sel-bg); color: var(--ink); font-weight: 700; }

/* 選んだ記号の意味 */
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 4px;
  box-shadow: var(--shadow); padding: 14px; margin: 16px 0;
}
.panel h2 { font-family: var(--font-serif); font-size: 19px; margin: 0 0 8px; }
.meanings { list-style: none; margin: 0; padding: 0; }
.meanings li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.meanings li:first-child { border-top: 0; padding-top: 0; }
.meanings svg { width: 40px; height: 40px; flex: 0 0 40px; color: var(--ink); }
.meanings .m-cat { font-size: 12px; color: var(--ink-sub); }
.meanings .m-name { font-weight: 700; }
.meanings .m-text { font-size: 15px; }
.meanings .m-old { font-size: 12.5px; color: var(--ink-sub); margin-top: 2px; }
.empty { color: var(--ink-sub); font-size: 15px; margin: 0; }

/* 総合判定 */
.verdict { border-radius: 4px; padding: 16px; margin: 16px 0; border: 2px solid var(--line); background: var(--card); }
.verdict.ok   { border-color: var(--ok);   background: var(--ok-bg); }
.verdict.warn { border-color: var(--warn); background: var(--warn-bg); }
.verdict.pro  { border-color: var(--pro);  background: var(--pro-bg); }
.verdict .v-label { font-size: 13px; color: var(--ink-sub); margin: 0; }
.verdict .v-title { font-family: var(--font-serif); font-size: 24px; font-weight: 800; margin: 2px 0 6px; line-height: 1.3; }
.verdict.ok .v-title   { color: var(--ok); }
.verdict.warn .v-title { color: var(--warn); }
.verdict.pro .v-title  { color: var(--pro); }
.verdict ul.reasons { margin: 0 0 12px; padding-left: 1.2em; }
.verdict ul.reasons li { margin: 4px 0; }
.verdict .guide { margin: 0; font-weight: 700; }
.verdict .guide + ul.reasons { margin-top: 6px; }

.exits { display: grid; gap: 10px; margin-top: 12px; }
.exit {
  display: block; text-decoration: none; text-align: center;
  border-radius: 4px; padding: 13px 12px; font-weight: 700; font-size: 16px;
  background: var(--accent); color: var(--accent-ink);
}
.exit.sub { background: var(--card); color: var(--accent-fg); border: 2px solid var(--accent-fg); }
/* 差し色：朱色＝宅配・相談系、深緑＝洗剤の比較記事 */
.exit.accent2 { background: var(--accent2); color: var(--accent2-ink); }
.exit.accent3 { background: var(--accent3); color: var(--accent3-ink); }
.exit.sub.accent2 { background: var(--card); color: var(--accent2); border-color: var(--accent2); }
.exit small { display: block; font-weight: 400; font-size: 12.5px; opacity: .9; }
.ad-box { border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: var(--card); }
.ad-note { display: inline-block; font-size: 12px; color: var(--ink-sub); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-bottom: 6px; }
.ad-box .exit { margin: 0; }
.exit-lead { font-size: 13px; color: var(--ink-sub); margin: 4px 0 -4px; }

/* シェアボタン */
.share h2 { font-family: var(--font-serif); font-size: 17px; margin: 0 0 4px; }
.share-lead { font-size: 13px; color: var(--ink-sub); margin: 0 0 10px; }
.share-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.share-btn {
  display: block; text-align: center; text-decoration: none; cursor: pointer;
  border: 2px solid var(--accent-fg); border-radius: 4px; background: var(--card); color: var(--accent-fg);
  padding: 10px 6px; font-weight: 700; font-size: 15px; line-height: 1.3; touch-action: manipulation;
}
.share-btn.wide { grid-column: 1 / -1; }
.share-btn[hidden] { display: none; }
.share-done { font-size: 13px; color: var(--ok); margin: 8px 0 0; min-height: 1.4em; text-align: center; }

.reset {
  display: block; width: 100%; margin: 8px 0 0;
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 10px; color: var(--ink-sub); cursor: pointer;
}

footer { font-size: 12.5px; color: var(--ink-sub); padding: 8px 0 24px; }
footer p { margin: 6px 0; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .step-main, .result-main { animation: none; }
}

/* ==========================================================
   2026-10-26 デザイン刷新（洗剤えらびチェッカーとそろえる）
   ========================================================== */
body { font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif; letter-spacing: .02em; }
header.top { padding: 14px 0 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.logo { margin: 0; font-family: var(--serif-en); font-size: 15px; letter-spacing: .28em; color: var(--gold); text-transform: uppercase; }
.logo small { display: block; font-family: "Zen Kaku Gothic New", sans-serif; font-size: 10px; letter-spacing: .12em; color: var(--ink-sub); text-transform: none; }
.crest { width: 32px; height: 32px; color: var(--gold); }
header.top .progress-label, header.top .progress-bar { flex: 0 0 100%; }
.progress-label { font-family: var(--serif-en); letter-spacing: .2em; color: var(--gold); margin: 12px 0 6px; }
.progress-bar { height: 3px; border-radius: 3px; background: var(--line); }
.progress-fill { background: var(--rose); border-radius: 3px; }
.step-q { font-size: 21px; font-weight: 600; line-height: 1.6; }
.grid { gap: 10px; }
.sym { border: 1.5px solid transparent; border-radius: 18px; box-shadow: var(--shadow); min-height: 100px; transition: transform .12s, border-color .15s, background .15s; }
.sym:active { transform: scale(.97); }
.sym svg { color: #6b5049; }
.sym[aria-pressed="true"] { border-color: var(--rose); background: var(--sel-bg); }
.sym[aria-pressed="true"] svg { color: var(--accent-fg); }
.sym.new .lbl::after { color: var(--gold); }
.none-btn { border-radius: 999px; border-color: var(--line); background: var(--card); }
.none-btn[aria-pressed="true"] { border-color: var(--rose); background: var(--sel-bg); }
button.next, .step-footer button, .step-footer a { border-radius: 999px !important; }
.panel { border: 0; border-radius: 22px; box-shadow: var(--shadow); padding: 18px 16px; }
.panel h2 { font-weight: 600; }
.verdict { border-radius: 22px; border-width: 1.5px; box-shadow: var(--shadow); padding: 20px 18px; }
.verdict .v-label { font-family: var(--serif-en); letter-spacing: .25em; text-transform: uppercase; color: var(--gold); }
.verdict .v-title { font-weight: 700; }
.exit { border-radius: 999px; padding: 14px 16px; letter-spacing: .05em; background: linear-gradient(135deg, #dba5a2, #c88581); box-shadow: 0 8px 22px rgba(200,133,129,.3); }
.exit.sub { background: var(--card); box-shadow: none; border: 1.5px solid var(--rose); color: var(--accent-fg); }
.exit.accent2 { background: linear-gradient(135deg, #b9b08a, #a39a6e); box-shadow: 0 8px 22px rgba(163,154,110,.3); }
.exit.accent3 { background: linear-gradient(135deg, #8db5a0, #6f9a84); box-shadow: 0 8px 22px rgba(111,154,132,.3); }
.exit.sub.accent2 { background: var(--card); color: var(--gold); border-color: var(--gold); box-shadow: none; }
.ad-box { border: 0; border-radius: 18px; background: var(--sel-bg); }
.ad-note { border-radius: 999px; }
.share-btn { border-radius: 999px; border-width: 1.5px; border-color: var(--rose); color: var(--accent-fg); }
.reset { border-radius: 999px; }
footer { text-align: center; }

<script>

/* ==========================================================
   記号の絵（すべて自作の SVG。64×64 の座標で描く）
   ========================================================== */
const svg = (inner) =>
  `<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const txt = (s, y, size) =>
  `<text x="32" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="currentColor" stroke="none">${s}</text>`;
const dot = (x, y, r = 2.8) => `<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;
const CROSS = '<path d="M8 8 L56 56 M56 8 L8 56"/>';
const bars = (n, y1) =>
  (n >= 1 ? `<path d="M12 ${y1} H52"/>` : '') + (n >= 2 ? `<path d="M12 ${y1 + 6} H52"/>` : '');

const TUB = '<path d="M7 14 L14 44 H50 L57 14"/><path d="M9 21 q5.75 -5 11.5 0 t11.5 0 t11.5 0 t11.5 0"/>';
// 手洗いの記号には数字が入らない（早見表どおり）。手をおけの中央・深めに入れる
const HAND = '<path fill="var(--sym-bg)" d="M20 2 V33 a2.5 2.5 0 0 0 5 0 a2.5 2.5 0 0 0 5 0 a2.5 2.5 0 0 0 5 0 a2.5 2.5 0 0 0 5 0 V22 l5 -4 a2 2 0 0 0 -2.6 -3 l-2.4 2 V2"/>';
const draw = {
  tub: (num, b = 0) => svg(TUB + txt(num, 40, 15) + bars(b, 52)),
  // 手洗い40℃は横線なし、手洗い30℃はおけの下に横線1本で見分ける
  hand: (b = 0) => svg(TUB + HAND + bars(b, 52)),
  tubNo: () => svg(TUB + CROSS),

  tri: () => svg('<path d="M32 7 L58 52 H6 Z"/>'),
  triOxy: () => svg('<path d="M32 7 L58 52 H6 Z"/><path d="M23 46 L32 28 M31 46 L40 28"/>'),
  triNo: () => svg('<path d="M32 7 L58 52 H6 Z"/>' + CROSS),

  tumble: (n) => svg('<rect x="8" y="8" width="48" height="48" rx="2"/><circle cx="32" cy="32" r="17"/>' +
    (n === 2 ? dot(26, 32) + dot(38, 32) : dot(32, 32))),
  tumbleNo: () => svg('<rect x="8" y="8" width="48" height="48" rx="2"/><circle cx="32" cy="32" r="17"/>' + CROSS),

  natural: (kind, shade) => {
    const lines = {
      line:  '<path d="M32 14 V50"/>',
      drip:  '<path d="M27 14 V50 M37 14 V50"/>',
      flat:  '<path d="M14 32 H50"/>',
      dflat: '<path d="M14 27 H50 M14 37 H50"/>',
    }[kind];
    return svg('<rect x="8" y="8" width="48" height="48" rx="2"/>' + lines + (shade ? '<path d="M8 22 L22 8"/>' : ''));
  },

  iron: (n, noSteam) => {
    const body = '<path d="M6 42 Q9 25 24 23 H56 V42 Z"/><path d="M28 23 Q30 11 40 11 H56 V23"/>';
    const dots = { 1: [38], 2: [32, 44], 3: [27, 38, 49] }[n].map((x) => dot(x, 33, noSteam ? 3.2 : 2.8)).join('');
    if (!noSteam) return svg(body + dots);
    // スチームなし：早見表どおり、アイロンの下に湯気の線を描いて×を重ねる。
    // 湯気を描く場所を空けるため、アイロンは少し小さくして上にずらす（線の太さは縮めた分だけ太くして見た目をそろえる）
    return svg(`<g transform="translate(4.8 -6.5) scale(0.85)" stroke-width="3.5">${body}${dots}</g>` +
      '<path d="M27 33 L28 45 M35 33 L34 45"/><path d="M20 41 a11 11 0 0 0 22 0"/><path d="M15 35 L47 61 M47 35 L15 61"/>');
  },
  ironNo: () => svg('<path d="M6 42 Q9 25 24 23 H56 V42 Z"/><path d="M28 23 Q30 11 40 11 H56 V23"/><path d="M8 6 L56 58 M56 6 L8 58"/>'),

  circle: (letter, b = 0) => svg('<circle cx="32" cy="27" r="21"/>' + txt(letter, 35, 22) + bars(b, 54)),
  circleNo: () => svg('<circle cx="32" cy="27" r="21"/><path d="M12 7 L52 47 M52 7 L12 47"/>'),
  circleLetterNo: (letter) => svg('<circle cx="32" cy="27" r="21"/>' + txt(letter, 35, 22) + '<path d="M12 7 L52 47 M52 7 L12 47"/>'),
};

/* ==========================================================
   状態と画面の組み立て（1画面1問。CATSの順にそのまま7画面になる）
   ========================================================== */
const ITEM = {};   // id -> item
const GROUP = {};  // groupId -> { group, cat }
CATS.forEach((c) => c.groups.forEach((g) => {
  GROUP[g.id] = { group: g, cat: c };
  g.items.forEach((it) => { ITEM[it.id] = it; });
}));

const NONE = '__none__';
const state = {}; // groupId -> itemId | NONE

/* ==========================================================
   効果音（音ファイルは使わず、ブラウザの中でオルゴール風の小さな音を作る）。右上のボタンで消せる
   ========================================================== */
const SND_KEY = 'fc-sentaku-sound';
let soundOn = true;
try { soundOn = localStorage.getItem(SND_KEY) !== 'off'; } catch (e) { /* 何もしない */ }
let ac = null;
const audio = () => {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === 'suspended') ac.resume();
  return ac;
};
const bell = (freq, at = 0, len = 0.5, vol = 0.07, attack = 0.012) => {
  const c = audio(); if (!c) return;
  const t0 = c.currentTime + at;
  [[1, vol], [2.01, vol * 0.25], [3.02, vol * 0.08]].forEach(([m, v]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq * m;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + len + 0.05);
  });
};
const NT = { C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.51, G6: 1567.98, C7: 2093 };
const SOUNDS = {
  open: () => { [NT.C5, NT.E5, NT.G5, NT.C6].forEach((f, k) => bell(f, k * 0.14, 1.8, 0.035, 0.12)); bell(NT.E6, 0.62, 1.6, 0.02, 0.2); },
  select: () => { bell(NT.E6, 0, 0.35, 0.06); bell(NT.G6, 0.06, 0.45, 0.05); },
  none: () => bell(NT.A5, 0, 0.35, 0.05),
  back: () => { bell(NT.E6, 0, 0.25, 0.04); bell(NT.C6, 0.07, 0.35, 0.04); },
  start: () => { bell(NT.G5, 0, 0.5); bell(NT.C6, 0.09, 0.6); },
  ok: () => { [NT.C6, NT.E6, NT.G6, NT.C7].forEach((f, k) => bell(f, k * 0.09, 0.9, 0.055)); bell(NT.G6, 0.45, 1.2, 0.03); },
  warn: () => { [NT.C6, NT.E6, NT.G6].forEach((f, k) => bell(f, k * 0.1, 0.8, 0.05)); },
  pro: () => { bell(NT.D5, 0, 0.5, 0.05); bell(NT.A5, 0.12, 0.7, 0.04); },
};
const play = (name) => { if (!soundOn) return; try { if (SOUNDS[name]) SOUNDS[name](); } catch (e) { /* 何もしない */ } };
const paintSnd = () => {
  document.documentElement.classList.toggle('snd-off', !soundOn);
  document.querySelectorAll('.snd').forEach((b) => { b.setAttribute('aria-pressed', String(soundOn)); b.title = soundOn ? '効果音：オン' : '効果音：オフ'; });
};
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('.snd');
  if (!b) return;
  soundOn = !soundOn;
  try { localStorage.setItem(SND_KEY, soundOn ? 'on' : 'off'); } catch (e2) { /* 何もしない */ }
  paintSnd();
  if (soundOn) play('select');
});
// 開いた瞬間の音。ブラウザに止められたときは、最初に画面に触れたときに鳴らす（ボタンを押したときは、そのボタンの音を優先）
let opened = false;
const tryOpen = () => {
  if (opened || !soundOn) return;
  const c = audio(); if (!c) return;
  if (c.state === 'running') { opened = true; play('open'); }
};
try { tryOpen(); } catch (e) { /* 何もしない */ }
setTimeout(() => { try { tryOpen(); } catch (e) { /* 何もしない */ } }, 300);
const firstTouch = (e) => {
  document.removeEventListener('pointerdown', firstTouch, true);
  document.removeEventListener('keydown', firstTouch, true);
  if (opened) return;
  opened = true;
  if (e.target && e.target.closest && e.target.closest('button, a')) return;
  play('open');
};
document.addEventListener('pointerdown', firstTouch, true);
document.addEventListener('keydown', firstTouch, true);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  iron: 'アイロン', drycl: 'ドライクリーニング', wetcl: 'ウエットクリーニング',

};

/* ==========================================================
   総合判定（迷ったら「プロに任せる」）
   7画面すべてに答えてから呼ばれるので、未回答を前提にした分岐は持たない
   ========================================================== */
function judge() {
  const wash = state.wash;
  if (wash === NONE) {
    return { level: 'pro', reasons: ['洗濯おけの記号が見当たらない・分からない状態です。'],
      guide: '洗い方が分からない衣類は、無理に家で洗わずプロにお任せください。' };
  }
  if (ITEM[wash].level === 'pro') {
    const allProhibited = state.drycl === 'dno' && state.wetcl === 'wcno';
    if (allProhibited) {
      return { level: 'pro', allProhibited: true,
        reasons: [ITEM[wash].reason, 'ドライクリーニング・ウエットクリーニングも禁止の表示です。'],
        guide: 'ご自身では洗えず、クリーニング店で行う通常の処理もできない表示です。お預かりできるか、まずご相談ください。' };
    }
    return { level: 'pro', reasons: [ITEM[wash].reason],
      guide: '家で洗うと縮み・色落ち・型くずれのおそれがあります。プロにお任せください。' };
  }

  const reasons = [];
  Object.keys(state).forEach((g) => {
    const it = ITEM[state[g]];
    if (it && it.level === 'warn' && !reasons.includes(it.reason)) reasons.push(it.reason);
  });
  if (reasons.length) {
    return { level: 'warn', reasons, guide: '次の点に気をつければ、家で洗えます。' };
  }
  return { level: 'ok', reasons: [], guide: 'ふだんどおり洗濯機で洗えます。' };
}

function exitLink(key, sub, note) {
  const l = LINKS[key];
  // 差し色は見た目だけの区別。朱色＝宅配・相談系、深緑＝洗剤の比較記事
  const color = (key === 'consult' || key === 'shiminuki' || key === 'takuhai') ? ' accent2'
    : key === 'affiliate' ? ' accent3' : '';
  return `<a class="exit${sub ? ' sub' : ''}${color}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${note ? `<small>${note}</small>` : ''}</a>`;
}
// 「広告を含みます」はアフィリエイト商品の近くだけに表示する（自社記事のため rel は noopener のみ）
const affiliateBox = () => `<div class="ad-box"><span class="ad-note">広告を含みます</span>${exitLink('affiliate', false)}</div>`;

function exitsFor(v) {
  if (v.level === 'ok') {
    return exitLink('senzai', false, '質問5つで、シミ抜きと洗剤の選び方が分かる（洗剤えらびチェッカー）') + exitLink('ownDetergent', true, 'クリーニング店が選んだ洗剤') + affiliateBox();
  }
  if (v.level === 'warn') {
    return exitLink('senzai', false, '質問5つで、シミ抜きと洗剤の選び方が分かる（洗剤えらびチェッカー）') + exitLink('ownDetergent', true, 'デリケートな衣類にも') + affiliateBox() +
      '<p class="exit-lead">自分で洗うのが不安なときは</p>' +
      exitLink('takuhai', false, 'ご自宅から出すだけ。北九州のファミリークリーニング');
  }
  if (v.allProhibited) {
    return exitLink('consult', false, '公式LINEが開きます。まずは状態を見てご案内します。北九州のファミリークリーニング');
  }
  return exitLink('takuhai', false, 'ご自宅から出すだけ。北九州のファミリークリーニング');
}

   ========================================================== */
function render() {
  setTimeout(paintSnd, 0);
  if (step >= STEPS.length) renderResult();
  else renderStep();
}

const prefersReducedMotion = () =>
  typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let pendingAdvance = null; // 保留中の「次へ」タイマー。戻る操作のときに取り消す

function choose(groupId, id) {
  if (locked) return;
  play(id === NONE ? 'none' : 'select');
  state[groupId] = id;
  locked = true;
  const sourceStep = step; // 選んだ時点の画面番号を固定しておく
  // 選んだ表示をその場で反映してから、次の画面へ（動きを抑える設定では待たない）
  document.querySelectorAll('#stepGrid button[data-id]').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.id === id));
  });
  const noneBtn = $('#stepNone');
  if (noneBtn) noneBtn.setAttribute('aria-pressed', String(id === NONE));
  const delay = prefersReducedMotion() ? 0 : 300;
  pendingAdvance = setTimeout(() => {
    pendingAdvance = null;
    locked = false;
    step = sourceStep + 1; // 選んだ画面の「次」へ進む（stepが後で変わっていても影響されない）
    render();
  }, delay);
}

function goBack() {
  play('back');
  // 選択直後の保留中タイマーがあれば取り消し、戻る操作を優先する
  if (pendingAdvance !== null) { clearTimeout(pendingAdvance); pendingAdvance = null; }
  locked = false;
  step = Math.max(0, step - 1);
  render();
}

function renderStep() {
  const s = STEPS[step];
  const g = s.group;
  const chosen = state[g.id];
  const pct = Math.round(((step + 1) / STEPS.length) * 100);

  $('#app').innerHTML = `
    <div class="wrap step-shell">
      <header class="top">
        <p class="logo">Family Cleaning<small>北九州・1970年創業のクリーニング店</small></p>
        <span class="top-r"><button type="button" class="snd" aria-pressed="true" aria-label="効果音のオン・オフ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button><svg class="crest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l1.5-8 4 4L12 6l2.5 6 4-4L20 16z"/><path d="M4 19h16"/><circle cx="12" cy="4.3" r=".9"/><circle cx="5.4" cy="7" r=".8"/><circle cx="18.6" cy="7" r=".8"/></svg></span>
        <p class="progress-label">${step + 1} / ${STEPS.length}　${esc(s.label)}</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </header>
      <main class="step-main">
        <p class="step-q" aria-live="polite">${esc(s.question)}</p>
        <div class="grid" id="stepGrid">
          ${g.items.map((it) => `
            <button type="button" class="sym${it.isNew ? ' new' : ''}" data-id="${it.id}" aria-pressed="${chosen === it.id}" aria-label="${esc(it.label)}">
              ${it.svg}<span class="lbl">${it.label}</span>
            </button>`).join('')}
        </div>
        <button type="button" class="none-btn" id="stepNone" aria-pressed="${chosen === NONE}">${esc(g.none)}</button>
      </main>
      <footer class="step-footer">
        ${step > 0 ? '<button type="button" class="reset" id="backBtn">戻る</button>' : ''}
      </footer>
    </div>`;

  $('#stepGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    choose(g.id, btn.dataset.id);
  });
  $('#stepNone').addEventListener('click', () => choose(g.id, NONE));
  const back = $('#backBtn');
  if (back) back.addEventListener('click', goBack);
}

function renderResult() {
  const v = judge();
  play(v.level);
  const meta = VERDICT[v.level];

  const rows = [];
  CATS.forEach((c) => c.groups.forEach((g) => {
    const val = state[g.id];
    if (!val || val === NONE) return;
    const it = ITEM[val];
    rows.push(`<li>${it.svg}<div>
      <div class="m-cat">${c.name}${c.groups.length > 1 ? '・' + g.title : ''}</div>
      <div class="m-name">${it.label}</div>
      <div class="m-text">${it.text}</div>
      ${it.old ? `<div class="m-old">※${it.old}</div>` : ''}
    </div></li>`);
  }));
  const meanings = rows.length
    ? `<ul class="meanings">${rows.join('')}</ul>`
    : '<p class="empty">記号を選ぶと、ここに意味が表示されます。</p>';

  $('#app').innerHTML = `
    <div class="wrap">
      <header class="top">
        <p class="logo">Family Cleaning<small>北九州・1970年創業のクリーニング店</small></p>
        <span class="top-r"><button type="button" class="snd" aria-pressed="true" aria-label="効果音のオン・オフ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button><svg class="crest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l1.5-8 4 4L12 6l2.5 6 4-4L20 16z"/><path d="M4 19h16"/><circle cx="12" cy="4.3" r=".9"/><circle cx="5.4" cy="7" r=".8"/><circle cx="18.6" cy="7" r=".8"/></svg></span>
      </header>
      <main class="result-main" aria-live="polite">
        <div class="verdict ${meta.cls}">
          <p class="v-label">総合判定</p>
          <p class="v-title">${meta.title}</p>
          ${v.level === 'warn' ? `<p class="guide">${v.guide}</p>` : ''}
          ${v.reasons.length ? `<ul class="reasons">${v.reasons.map((r) => `<li>${r}</li>`).join('')}</ul>` : ''}
          ${v.level === 'warn' ? '' : `<p class="guide">${v.guide}</p>`}
          <div class="exits">${exitsFor(v)}${state.bleach === 'b_no' ? exitLink('shiminuki', true, '公式LINEが開きます。色や生地を傷めずに落とせるか、職人がご案内します') : ''}</div>
        </div>

        <section class="panel" aria-labelledby="meanings-h">
          <h2 id="meanings-h">選んだ記号の意味</h2>
          ${meanings}
        </section>

        <section class="panel share" aria-labelledby="share-h">
          <h2 id="share-h">このチェッカーを教える</h2>
          <p class="share-lead">ご家族やお友だちに送れます（選んだ記号や判定は送られません）。</p>
          <div class="share-btns">
            <a class="share-btn" href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(SHARE.url)}" target="_blank" rel="noopener">LINEで送る</a>
            <a class="share-btn" href="https://x.com/intent/post?text=${encodeURIComponent(SHARE.text)}&amp;url=${encodeURIComponent(SHARE.url)}" target="_blank" rel="noopener">Xでポスト</a>
            <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(SHARE.url)}" target="_blank" rel="noopener">Facebook</a>
            <button type="button" class="share-btn" id="copyBtn">リンクをコピー</button>
            <button type="button" class="share-btn wide" id="nativeShareBtn" hidden>ほかのアプリで送る（Instagramなど）</button>
          </div>
          <p class="share-done" id="shareDone" role="status"></p>
        </section>

        <button type="button" class="reset" id="restartBtn">最初からやり直す</button>
      </main>
      <footer>
        <p>記号の種類と意味は、消費者庁の繊維製品品質表示規程が引用する JIS L 0001（2024年8月改正）にもとづいています。</p>
        <p>参考資料：<a href="https://www.caa.go.jp/policies/policy/representation/household_goods/assets/representation_cms219_240820_14.pdf" target="_blank" rel="noopener">消費者庁「衣類の取扱表示」（令和6年8月改正・PDF）を開く</a>（別のタブで開きます）</p>
        <p>2025年8月以前に作られた衣類では、アイロンの温度が改正前の値の場合があります（各記号の説明に記載）。2016年11月以前の旧表示（「中性」「手洗イ」など文字の入った記号）には対応していません。</p>
        <p>判定は目安です。タグにある言葉（「単独洗い」「裏返して洗う」など）や素材の表示もあわせてご確認ください。</p>
        <p>選んだ内容はこのページの中だけで使い、どこにも送信しません。</p>
        <p>© ファミリークリーニング</p>
      </footer>
    </div>`;

  setupShare();

  $('#restartBtn').addEventListener('click', () => {
    Object.keys(state).forEach((k) => delete state[k]);
    step = 0;
    play('start');
    render();
  });
}

// シェアボタンの動き（リンクのコピーと、スマホの共有メニュー）
function setupShare() {
  const done = $('#shareDone');
  $('#copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(SHARE.url);
    } catch (e) {
      // 古いブラウザ向けの予備の方法
      const t = document.createElement('textarea');
      t.value = SHARE.url; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e2) { /* 何もしない */ }
      t.remove();
    }
    done.textContent = 'リンクをコピーしました';
  });
  const native = $('#nativeShareBtn');
  if (navigator.share) {
    native.hidden = false;
    native.addEventListener('click', () => {
      navigator.share({ title: 'その洋服、洗える？｜洗濯表示チェッカー', text: SHARE.text, url: SHARE.url }).catch(() => {});
    });
  }
}

// 最初のタイトル画面：アニメーションが終わったら取り除く。タップで飛ばせる
(() => {
  const splash = document.getElementById('splash');
  if (!splash) return;
  const remove = () => splash.remove();
  splash.addEventListener('animationend', (e) => { if (e.animationName === 'splash-out') remove(); });
  splash.addEventListener('click', remove);
  setTimeout(remove, 2500); // 念のため
})();

render();
</script>
</body>
</html>
